name: production

on:
  workflow_dispatch:

jobs:
  test-then-wait-for-manual-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest
      - run: echo "Tests passed. Deploy this commit from the Render dashboard with Manual Deploy."
