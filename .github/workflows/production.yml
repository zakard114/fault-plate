name: production

on:
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest
      - name: Deploy production only after this manual run
        env:
          RENDER_PRODUCTION_DEPLOY_HOOK_URL: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_PRODUCTION_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$RENDER_PRODUCTION_DEPLOY_HOOK_URL"
          else
            echo "Tests passed. Deploy this commit from the Render dashboard with Manual Deploy."
          fi
