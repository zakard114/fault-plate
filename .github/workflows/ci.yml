name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest

  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Record the dev deployment
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'dev',
              description: 'Dev deploy',
              auto_merge: false,
              required_contexts: [],
              production_environment: false,
            });
            const deploymentId = result.data.id;
            if (!deploymentId) {
              core.setFailed('GitHub did not record the dev deployment.');
              return;
            }
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
              state: 'success',
              environment: 'dev',
              description: 'Dev deploy recorded. Render auto-deploy of main is the dev host.',
              environment_url: 'https://fault-plate.onrender.com',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            core.info(`Recorded dev deployment ${deploymentId} for ${context.sha}.`);
      - name: Deploy the dev service
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "Dev deploy recorded. Render auto-deploy of main remains the dev host https://fault-plate.onrender.com."
          fi
